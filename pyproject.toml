[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatsapp-business-cloud"
version = "0.1.1"
description = "Python client for the WhatsApp Business Platform (Cloud API)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "whatsapp-business-cloud contributors" }]
keywords = ["whatsapp", "whatsapp-business", "cloud-api", "meta", "messaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/pkshahid/wapi"
Documentation = "https://github.com/pkshahid/wapi#readme"
Repository = "https://github.com/pkshahid/wapi"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_business_cloud"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]
ignore = ["E501"]

[tool.mypy]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/whatsapp_business_cloud"]
